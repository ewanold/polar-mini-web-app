[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polar-app"
version = "0.1.0"
description = "Private Polar training and recovery web application"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.10,<4",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polar_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["polar_app"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
