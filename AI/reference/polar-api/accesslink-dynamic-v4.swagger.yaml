      - SPEED_VIEW_PACE
      - SPEED_VIEW_SPEED
    default: SPEED_VIEW_PACE
    description: |-
      Speed view options.

       - SPEED_VIEW_PACE: Speed is displayed as pace (e.g., min/km).
       - SPEED_VIEW_SPEED: Speed is displayed as speed (e.g., km/h).
  sportSprintDetection:
    type: object
    properties:
      source:
        $ref: '#/definitions/SprintDetectionSprintDetectionSource'
      sprintThresholdAcceleration:
        type: number
        format: float
        description: Sprint threshold for acceleration m/s^2.
      sprintThresholdSpeed:
        type: number
        format: float
        description: Sprint threshold for speed km/h.
  sportStrideSensorCalibSettings:
    type: object
    properties:
      runningFactor:
        type: number
        format: float
      calibType:
        $ref: '#/definitions/StrideSensorCalibSettingsStrideCalibType'
      runningFactorSource:
        $ref: '#/definitions/StrideSensorCalibSettingsRunningFactorSource'
  sportSupportedFeatures:
    type: object
    properties:
      speedZones:
        type: boolean
        description: Whether speed zones are relevant for this sport.
      sensorBroadcastingHr:
        type: boolean
        description: Whether heart rate broadcasting is enabled by default.
      powerZonesRelevant:
        type: boolean
        description: Indicates if power zones are relevant for this sport.
    description: Supported features for a sport, indicating whether certain functionalities are available or enabled by default.
    title: SupportedFeatures
    required:
      - speedZones
      - default_sensor_broadcasting_hr
      - powerZonesRelevant
  sportSwimmingPoolInfo:
    type: object
    properties:
      swimmingPoolType:
        $ref: '#/definitions/SwimmingPoolInfoSwimmingPoolUnits'
      poolLength:
        type: number
        format: float
  sportTrainingDisplay:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          $ref: '#/definitions/sportTrainingDisplayItem'
    description: Represents a training display.
  sportTrainingDisplayItem:
    type: object
    properties:
      name:
        type: string
      id:
        type: integer
        format: int64
    description: Represent a single item in a training display.
  sportTrainingReminder:
    type: object
    properties:
      type:
        $ref: '#/definitions/TrainingReminderTrainingReminderType'
        description: Type of the reminder.
      text:
        type: string
        description: Reminder text to be shown in the product during exercise.
      calorie:
        type: integer
        format: int32
        description: Set when type is CALORIES_BASED.
      time:
        type: integer
        format: int32
        description: Set when type is TIME_BASED.
      distance:
        type: number
        format: float
        description: Set when type is DISTANCE_BASED.
    description: Configuration for training reminders in products with the TRAINING_REMINDER capability. Displays a message after a specified duration, distance, or calorie threshold is reached.
  sportUserSportProfile:
    type: object
    properties:
      uuid:
        type: string
        description: Sport profile ecosystem identifier.
      created:
        type: string
        format: date-time
        description: Creation time of the sport profile in UTC time in format (yyyy-mm-ddThh:mm:ssssssZ).
      modified:
        type: string
        format: date-time
        description: Last modification time of the sport profile in UTC time in format (yyyy-mm-ddThh:mm:ssssssZ).
      profile:
        $ref: '#/definitions/sportSportProfile'
    description: Aggregate root for sport profile data.
  sportUserSportProfileCatalog:
    type: object
    properties:
      uuid:
        type: string
        description: Sport profile catalog ecosystem identifier.
      created:
        type: string
        format: date-time
        description: Creation time of the catalog in UTC time in format (yyyy-mm-ddThh:mm:ssssssZ).
      modified:
        type: string
        format: date-time
        description: Last modification time of the catalog in UTC time in format (yyyy-mm-ddThh:mm:ssssssZ).
      activeSportProfileListIndex:
        type: integer
        format: int64
        description: The index of the active sport profile list (see SportProfileList.index). Not set if there are no profile lists.
      lists:
        type: array
        items:
          type: object
          $ref: '#/definitions/sportSportProfileList'
    description: Aggregate root for sport profile list catalog.
  sportVolume:
    type: object
    properties:
      volume:
        type: integer
        format: int32
        description: 'Volume level range: 0 (minimum) to 100 (maximum).'
  HypnogramSleepRating:
    type: string
    enum:
      - SLEEP_RATING_UNKNOWN
      - SLEEP_RATING_SLEPT_BAD
      - SLEEP_RATING_SLEPT_QUITE_BAD
      - SLEEP_RATING_SLEPT_NEITHER_BAD_NOR_WELL
      - SLEEP_RATING_SLEPT_QUITE_WELL
      - SLEEP_RATING_SLEPT_WELL
    default: SLEEP_RATING_UNKNOWN
    title: SleepRating
  SleepStateChangeSleepState:
    type: string
    enum:
      - SLEEP_STATE_WAKE
      - SLEEP_STATE_REM
      - SLEEP_STATE_NON_REM1
      - SLEEP_STATE_NON_REM2
      - SLEEP_STATE_NON_REM3
      - SLEEP_STATE_UNKNOWN
    default: SLEEP_STATE_WAKE
    description: |-
      - SLEEP_STATE_WAKE: This is regarded as an interruption of sleep during night.
       - SLEEP_STATE_REM: rem sleep.
       - SLEEP_STATE_NON_REM1: non rem sleep.
       - SLEEP_STATE_NON_REM2: non rem sleep.
       - SLEEP_STATE_NON_REM3: Deepest sleep.
       - SLEEP_STATE_UNKNOWN: State is unknown e.g. because of bad skin contact.
    title: SleepState
  SleepWakeStateChangeSleepWakeState:
    type: string
    enum:
      - SLEEP_WAKE_STATE_SLEEP
      - SLEEP_WAKE_STATE_WAKE
      - SLEEP_WAKE_STATE_NO_DATA
    default: SLEEP_WAKE_STATE_SLEEP
    title: SleepWakeState
  domainssleepDeviceReference:
    type: object
    properties:
      uuid:
        type: string
        example: 0e030000-0084-0000-0000-00001234abcd
        description: Unique identifier of the device.
        maxLength: 36
        minLength: 36
    title: DeviceReference
    required:
      - uuid
  domainssleepErrorResponse:
    type: object
    properties:
      errorMessage:
        type: string
    title: ErrorResponse
  sleepAnalysis:
    type: object
    properties:
      efficiencyPercent:
        type: number
        format: double
        description: 'Sleep efficiency in percent. Range: [0.0 - 100.0].'
        maximum: 100
      continuityIndex:
        type: number
        format: double
        description: 'Sleep continuity index. Range: [0.0 - 5.0].'
        maximum: 5
      continuityClass:
        type: integer
        format: int32
        description: 'Sleep continuity class. Range: [0 - 5].'
        maximum: 5
      feedback:
        type: string
        example: "01101"
        description: |-
          Sleep feedback.
          Contains 5 digits, order of digits: [own sleep time goal, sleep efficiency, sleep continuity, own sleep rating, recommended sleep time].
          Values: 0 = below, 1 = above and 2 = no evaluation.
        pattern: ^[0-2]{5}$
    title: Analysis
    required:
      - efficiencyPercent
      - continuityIndex
      - continuityClass
  sleepHypnogram:
    type: object
    properties:
      sleepStart:
        type: string
        example: "2025-01-01T23:12:33.435+02:00"
        description: Sleep start time in ISO-8601 offset date-time format. User's local time.
      sleepEnd:
        type: string
        example: "2025-01-02T08:12:33.435+02:00"
        description: Sleep end time in ISO-8601 offset date-time format. User's local time.
      alarmStopTime:
        type: string
        example: "2025-01-02T08:15:33.435+02:00"
        description: Time when the user stopped the alarm in ISO-8601 offset date-time format. User's local time. Optional.
      alarmSnoozeTimes:
        type: array
        example:
          - "2025-01-01T08:05:00.435+02:00"
          - "2025-01-01T08:10:00.435+02:00"
        items:
          type: string
        description: List of times when the user snoozed the alarm in ISO-8601 offset date-time format. User's local time.
      sleepStateChanges:
        type: array
        items:
          type: object
          $ref: '#/definitions/sleepSleepStateChange'
        description: List of changes in the depth of user's sleep.
      sleepStartOffsetSeconds:
        type: integer
        format: int32
        description: Offset seconds for sleep start time. Used in sleep trimming. Value can be negative or positive.
        multipleOf: 30
        maximum: 10800
        minimum: -3600
      sleepEndOffsetSeconds:
        type: integer
        format: int32
        description: Offset seconds for sleep end time. Used in sleep trimming. Value can be negative or positive.
        multipleOf: 30
        maximum: 3600
        minimum: -10800
      sleepRating:
        $ref: '#/definitions/HypnogramSleepRating'
        description: Sleep quality rating. Optional.
      sleepGoal:
        type: string
        example: 28800s
        description: Sleep duration goal. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
        maximum: 72000
        minimum: 14400
      birthday:
        type: string
        example: "2000-01-01"
        description: The user's birthday in ISO 8601 date format.
      deviceReference:
        $ref: '#/definitions/domainssleepDeviceReference'
        description: The recording Device ID. Optional.
      batteryRanOut:
        type: boolean
        description: Tells whether the sleep recording was stopped because of low battery. Default is false.
    title: Hypnogram
    required:
      - sleepStart
      - sleepEnd
      - birthday
      - batteryRanOut
  sleepInterruptions:
    type: object
    properties:
      totalDuration:
        type: string
        example: 220s
        description: Total duration of interruptions. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      longDuration:
        type: string
        example: 180s
        description: Duration of long interruptions. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      shortDuration:
        type: string
        example: 40s
        description: Duration of short interruptions. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      totalCount:
        type: integer
        format: int32
        description: Total count of interruptions.
      longCount:
        type: integer
        format: int32
        description: Count of long interruptions.
      shortCount:
        type: integer
        format: int32
        description: Count of short interruptions.
    title: Interruptions
    required:
      - totalDuration
      - longDuration
      - shortDuration
      - totalCount
      - longCount
      - shortCount
  sleepListSleepWakeVectorsResponse:
    type: object
    properties:
      sleepWakeVectors:
        type: array
        items:
          type: object
          $ref: '#/definitions/sleepSleepWakeVector'
        description: The list of sleep/wake state vectors for the requested range.
    title: ListSleepWakeVectorsResponse
  sleepListSleepsResponse:
    type: object
    properties:
      nightSleeps:
        type: array
        items:
          type: object
          $ref: '#/definitions/sleepNightSleep'
        description: The list of night sleeps from the requested range.
    title: ListSleepsResponse
  sleepNightSleep:
    type: object
    properties:
      sleepDate:
        type: string
        example: "2025-01-02"
        description: Date of the sleep in ISO 8601 format.
      sleepResult:
        $ref: '#/definitions/sleepSleepResult'
        description: Sleep result.
      originalSleepResult:
        $ref: '#/definitions/sleepSleepResult'
        description: Sleep result as it was originally before any edits. Only available if the sleep has been edited.
      sleepScore:
        $ref: '#/definitions/sleepSleepScoreData'
        description: Sleep score data.
      sleepEvaluation:
        $ref: '#/definitions/sleepSleepEvaluation'
        description: Sleep evaluation.
    title: NightSleep
    required:
      - sleepDate
  sleepPhaseDurations:
    type: object
    properties:
      wake:
        type: string
        example: 60s
        description: Duration of wake phase. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      rem:
        type: string
        example: 70s
        description: Duration of rem phase. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      light:
        type: string
        example: 80s
        description: Duration of light sleep. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      deep:
        type: string
        example: 90s
        description: Duration of deep sleep. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      unknown:
        type: string
        example: 100s
        description: Duration of unknown phase. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      remPercentage:
        type: number
        format: double
        description: 'Percentage of time spent in rem phase. Range: [0.0 - 100.0].'
        maximum: 100
      deepPercentage:
        type: number
        format: double
        description: 'Percentage of time spent in deep sleep. Range: [0.0 - 100.0].'
        maximum: 100
    title: PhaseDurations
    required:
      - wake
      - rem
      - light
      - deep
      - unknown
      - remPercentage
      - deepPercentage
  sleepSleepCycle:
    type: object
    properties:
      secondsFromSleepStart:
        type: integer
        format: int64
        description: Start offset from the beginning of the sleep.
      sleepDepthAtCycleStart:
        type: number
        format: float
        description: 'Sleep depth at the start of sleep cycle. Range: [0.0 - 2.0].'
        maximum: 2
    title: SleepCycle
    required:
      - secondsFromSleepStart
      - sleepDepthAtCycleStart
  sleepSleepEvaluation:
    type: object
    properties:
      sleepType:
        $ref: '#/definitions/sleepSleepType'
      sleepSpan:
        type: string
        description: Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      asleepDuration:
        type: string
        description: Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      age:
        type: number
        format: double
        description: User age in years.
      analysis:
        $ref: '#/definitions/sleepAnalysis'
        description: Sleep analysis.
      interruptions:
        $ref: '#/definitions/sleepInterruptions'
        description: Sleep interruptions.
      phaseDurations:
        $ref: '#/definitions/sleepPhaseDurations'
        description: Sleep phases durations.
    title: SleepEvaluation
  sleepSleepResult:
    type: object
    properties:
      hypnogram:
        $ref: '#/definitions/sleepHypnogram'
        description: Hypnogram data.
      sleepCycles:
        type: array
        items:
          type: object
          $ref: '#/definitions/sleepSleepCycle'
        description: Sleep cycles.
    title: SleepResult
  sleepSleepScoreData:
    type: object
    properties:
      created:
        type: string
        format: date-time
        example: "2025-05-20T03:00:59.064Z"
        description: Creation time in UTC. Timestamp in RFC 3339 format "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z".
      lastModified:
        type: string
        format: date-time
        example: "2025-05-20T03:00:59.064Z"
        description: Last modification time in UTC. Timestamp in RFC 3339 format "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z".
      sleepScore:
        type: number
        format: float
        description: Average score of the overall sleep. (1 to 100).
        maximum: 100
        minimum: 1
      sleepTimeOwnTargetScore:
        type: number
        format: float
        description: Score of the sleep w.r.t. ownTargetSleepTime. (1 to 100).
        maximum: 100
        minimum: 1
      sleepTimeRecommendationScore:
        type: number
        format: float
        description: Score of the sleep w.r.t recommended sleep time. (1 to 100).
        maximum: 100
        minimum: 1
      continuityScore:
        type: number
        format: float
        description: Score of the sleep w.r.t continuityIndex. (1 to 100).
        maximum: 100
        minimum: 1
      efficiencyScore:
        type: number
        format: float
        description: Score of the sleep w.r.t SleepEfficiency. (1 to 100).
        maximum: 100
        minimum: 1
      remScore:
        type: number
        format: float
        description: Score of the sleep w.r.t REM sleep. (1 to 100).
        maximum: 100
        minimum: 1
      n3Score:
        type: number
        format: float
        description: Score of the sleep w.r.t N3 sleep. (1 to 100).
        maximum: 100
        minimum: 1
      longInterruptionsTimeScore:
        type: number
        format: float
        description: Score of the sleep w.r.t long interruption time. (1 to 100).
        maximum: 100
        minimum: 1
      groupDurationScore:
        type: number
        format: float
        description: Average score of duration variables.
        maximum: 100
        minimum: 1
      groupSolidityScore:
        type: number
        format: float
        description: Average score of solidity variables.
        maximum: 100
        minimum: 1
      groupRefreshScore:
        type: number
        format: float
        description: Average score of refresh variables.
        maximum: 100
        minimum: 1
      scoreRate:
        type: integer
        format: int32
        description: Rating of sleep score status in scale 1-5 compared to own usual level (1 = worst, 5 = best).
        maximum: 5
        minimum: 1
    title: SleepScoreData
    required:
      - created
      - lastModified
      - sleepScore
      - sleepTimeOwnTargetScore
      - sleepTimeRecommendationScore
      - continuityScore
      - efficiencyScore
      - remScore
      - n3Score
      - longInterruptionsTimeScore
      - groupDurationScore
      - groupSolidityScore
      - groupRefreshScore
  sleepSleepStateChange:
    type: object
    properties:
      offsetFromStart:
        type: string
        example: 30s
        description: Offset from the start of the sleep. Format is seconds with optional fraction of seconds in maximum of nanoseconds precision like "3.000000001s".
      newState:
        $ref: '#/definitions/SleepStateChangeSleepState'
        description: The state the user went into.
    title: SleepStateChange
    required:
      - offsetFromStart
  sleepSleepType:
    type: string
    enum:
      - SLEEP_TYPE_UNKNOWN
      - SLEEP_TYPE_SLEEP_TIME_ONLY
      - SLEEP_TYPE_SLEEP_PLUS
      - SLEEP_TYPE_SLEEP_PLUS_STAGES
    default: SLEEP_TYPE_UNKNOWN
    description: |-
      - SLEEP_TYPE_UNKNOWN: Sleep type is unknown.
       - SLEEP_TYPE_SLEEP_TIME_ONLY: Sleep information contains sleep time only, no sleep stages and sleep cycles.
       - SLEEP_TYPE_SLEEP_PLUS: Sleep information contains sleep time with sleep stages, no sleep cycles.
       - SLEEP_TYPE_SLEEP_PLUS_STAGES: Sleep information contains sleep time with sleep stages and sleep cycles.
    title: SleepType
  sleepSleepWakeStateChange:
    type: object
    properties:
      startOffset:
        type: integer
        format: int64
        description: Start of the new state as milliseconds from the start of the day.
      newState:
        $ref: '#/definitions/SleepWakeStateChangeSleepWakeState'
    title: SleepWakeStateChange
    required:
      - startOffset
  sleepSleepWakeVector:
    type: object
    properties:
      date:
        type: string
        example: "2025-01-02"
        description: Start date of the vector. Date in ISO-8601 format.
      deviceReference:
        $ref: '#/definitions/domainssleepDeviceReference'
        description: The recording device reference.
      sleepWakeStateChanges:
        type: array
        items:
          type: object
          $ref: '#/definitions/sleepSleepWakeStateChange'
        description: List of sleep/wake state changes for the date.
    title: SleepWakeVector
    required:
      - date
  DirectionInstructionContinueStraight:
    type: object
  DirectionInstructionFork:
    type: object
    properties:
      direction:
        $ref: '#/definitions/ForkForkDirection'
        description: Direction of the fork.
  DirectionInstructionRoundaboutExit:
    type: object
    properties:
      currentExitNumber:
        type: integer
        format: int64
        description: |-
          The number of the exit
          The exit through which the roundabout is entered is number 0
          In range [0, total_exits-1].
      targetExitNumber:
        type: integer
        format: int64
        description: |-
          The target exit's number to which this instruction is guiding the user to.
          In range [1, total_exits-1].
      totalExits:
        type: integer
        format: int64
        description: |-
          The total number of exits in this roundabout.
          Also counts exits that are not part of the route.
      orientation:
        $ref: '#/definitions/RoundaboutExitRoundaboutOrientation'
        description: Orientation of the roundabout.
  DirectionInstructionTurn:
    type: object
    properties:
      direction:
        $ref: '#/definitions/TurnTurnDirection'
        description: Direction of the turn.
      type:
        $ref: '#/definitions/TurnTurnType'
        description: Type of the turn.
  DirectionInstructionUTurn:
    type: object
  ForkForkDirection:
    type: string
    enum:
      - NO_DIRECTION
      - LEFT
      - RIGHT
    default: NO_DIRECTION
    description: |2-
       - NO_DIRECTION: No direction specified.
       - LEFT: Fork left.
       - RIGHT: Fork right.
  RoundaboutExitRoundaboutOrientation:
    type: string
    enum:
      - UNKNOWN
      - CLOCKWISE
      - COUNTERCLOCKWISE
    default: UNKNOWN
    description: |2-
       - UNKNOWN: Unknown orientation.
       - CLOCKWISE: Clockwise orientation.
       - COUNTERCLOCKWISE: Counterclockwise orientation.
  TurnTurnDirection:
    type: string
    enum:
      - NO_DIRECTION
      - LEFT
      - RIGHT
    default: NO_DIRECTION
    description: |2-
       - NO_DIRECTION: No direction specified.
       - LEFT: Turn left.
       - RIGHT: Turn right.
  TurnTurnType:
    type: string
    enum:
      - REGULAR
      - SLIGHT
      - SHARP
    default: REGULAR
    description: |2-
       - REGULAR: Regular turn: right angle: ~90 degrees.
       - SLIGHT: Slight turn: obtuse angle: ~100-180 degrees.
       - SHARP: Sharp turn: acute angle: ~0-80 degrees.
  apiLoadRouteResponse:
