  subscriptionUserSubscriptions:
    type: object
    properties:
      userSubscriptions:
        type: array
        items:
          type: object
          $ref: '#/definitions/subscriptionUserSubscription'
        title: User subscriptions
    title: User subscriptions
  ExerciseTargetExerciseType:
    type: string
    enum:
      - FREE
      - VOLUME
      - PHASED
      - STEADY_RACE_PACE
      - ROUTE
      - SEGMENT
      - STRENGTH
    default: FREE
    description: |2-
       - FREE: Free target. This type of target has no guidance or goal.
       - VOLUME: Target that tracks a volume metric.
      One of distance, duration, calories must be set for this type of target.
       - PHASED: Phased target. A target with a series of phases and repeats.
       - STEADY_RACE_PACE: Steady race pace target. Tracks race pace, which is a function of distance and duration.
      Both duration and distance must be set for this type of target.
       - ROUTE: Target based on a training route.
       - SEGMENT: Target based on a Strava segment.
       - STRENGTH: Strength training target.
  PhaseGoalGoalType:
    type: string
    enum:
      - MANUAL
      - DURATION
      - DISTANCE
    default: MANUAL
    description: |2-
       - MANUAL: Phase lasts until user manually changes the phase.
       - DURATION: Phase lasts for a set duration of time.
       - DISTANCE: Phase lasts for a set distance.
  PhaseIntensityIntensityType:
    type: string
    enum:
      - NONE
      - HEART_RATE_ZONES
      - POWER_ZONES
      - SPEED_ZONES
    default: NONE
    description: |2-
       - NONE: Nothing is tracked.
       - HEART_RATE_ZONES: Heart rate data is tracked.
       - POWER_ZONES: Power data is tracked.
       - SPEED_ZONES: Speed data is tracked.
  PhaseOrRepeatChangeType:
    type: string
    enum:
      - MANUAL
      - AUTOMATIC
    default: MANUAL
    description: |-
      Type of behaviour wrist unit should follow during phase change.

       - MANUAL: User manually changes the exercise phase.
       - AUTOMATIC: Wrist unit automatically changes the exercise phase.
  domainstrainingtargetErrorResponse:
    type: object
    properties:
      errorMessage:
        type: string
  trainingtargetDateTime:
    type: object
    properties:
      year:
        type: integer
        format: int64
      month:
        type: integer
        format: int64
      day:
        type: integer
        format: int64
      hour:
        type: integer
        format: int64
      min:
        type: integer
        format: int64
      sec:
        type: integer
        format: int64
    title: Date time in UTC
  trainingtargetExerciseTarget:
    type: object
    properties:
      idx:
        type: integer
        format: int64
        description: |-
          Required. Each exercise target of a session target or a favorite has a unique index number.
          Determines exercise target order during training session.
      type:
        $ref: '#/definitions/ExerciseTargetExerciseType'
        description: Required. Type of target.
      duration:
        type: integer
        format: int64
        description: |-
          Goal duration. Required for STEADY_RACE_PACE type targets. See details under ExerciseType.
          Milliseconds between 1000 (0:00:01) and 359999000 (99:59:59).
        maximum: 3.59999e+08
        minimum: 1000
      distance:
        type: number
        format: float
        description: |-
          Goal distance. Required for STEADY_RACE_PACE type targets. See details under ExerciseType.
          Meters between 1 and 9 999 000 (9 999 km).
        maximum: 9.999e+06
        minimum: 1
      kiloCalories:
        type: integer
        format: int64
        description: |-
          Optional. Goal calories. Relevant for VOLUME type target. See details under ExerciseType.
          Kilocalories between 1 and 65535 kcal.
        maximum: 65535
        minimum: 1
      sportId:
        type: string
        format: uint64
        description: Optional. Database id of the exercise target sport.
      routeId:
        type: string
        format: uint64
        description: A reference to the route in route-service. Required for ROUTE type targets.
      segmentId:
        type: string
        format: uint64
        description: Database id of the Strava segment this target is based on. Required for SEGMENT type targets.
      phaseOrRepeat:
        type: array
        items:
          type: object
          $ref: '#/definitions/trainingtargetPhaseOrRepeat'
        description: |-
          List of phases and repeats for this target. Required for PHASED target types.
          PHASED type target must have 1 to 20 unique phases, ignoring repeats. Repeat structure can be max 2 levels deep.
          Maximum total number of phases is 200 when taking repeats into account.
        maxItems: 200
    description: Target representing a single exercise.
    required:
      - idx
  trainingtargetFavoriteTarget:
    type: object
    properties:
      favorite:
        $ref: '#/definitions/trainingtargetFavoriteTrainingSessionTarget'
        description: Target representing a user favorite target. Required in requests, and will be filled in responses.
      exercise:
        type: array
        items:
          type: object
          $ref: '#/definitions/trainingtargetExerciseTarget'
          required:
            - exercise
        description: |-
          Target representing a single exercise. Required in requests, and will be filled in responses.
          In theory one favorite session can have multiple exercise targets,
          but in practice only one exercise target is expected.
        minItems: 1
    description: |-
      *
      Favorite target.
      Training targets can be generated by using favorites as templates.
      Favorites can include routes and Strava segments in addition to standard target types.
      See "ExerciseType" for all possible target types.
    required:
      - favorite
  trainingtargetFavoriteTrainingSessionTarget:
    type: object
    properties:
      id:
        type: string
        format: uint64
        description: Database ID. Required for update requests. Will be filled in responses.
      created:
        $ref: '#/definitions/trainingtargetDateTime'
        description: Database time of creation. Optional for requests. Will be filled in responses.
      modified:
        $ref: '#/definitions/trainingtargetDateTime'
        description: Database time of last modification. Optional for requests. Will be filled in responses.
      name:
        type: string
        description: Required. Favorite name.
        maxLength: 45
        minLength: 1
      description:
        type: string
        description: Optional. Description of favorite.
        maxLength: 500
      organisationId:
        type: string
        format: uint64
        description: Database id of organisation this favorite belongs to. Required if favorite belongs to an organisation.
    description: Favorite target.
    required:
      - name
  trainingtargetLoadFavoritesResponse:
    type: object
    properties:
      favoriteTarget:
        type: array
        items:
          type: object
          $ref: '#/definitions/trainingtargetFavoriteTarget'
  trainingtargetLoadTargetsResponse:
    type: object
    properties:
      trainingTarget:
        type: array
        items:
          type: object
          $ref: '#/definitions/trainingtargetTrainingTarget'
  trainingtargetPhaseGoal:
    type: object
    properties:
      type:
        $ref: '#/definitions/PhaseGoalGoalType'
        description: Required. Type of phase goal.
      duration:
        type: integer
        format: int64
        description: Required for DURATION goal type. Goal duration of phase. Milliseconds between 1000 (0:00:01) and 359999000 (99:59:59).
        maximum: 3.59999e+08
        minimum: 1000
      distance:
        type: number
        format: float
        description: Required for DISTANCE goal type. Goal distance of phase. Meters between 1 and 9 999 000 (9 999 km).
        maximum: 9.999e+06
        minimum: 1
    description: Phase goal. Determines when the phase will be complete.
  trainingtargetPhaseIntensity:
    type: object
    properties:
      type:
        $ref: '#/definitions/PhaseIntensityIntensityType'
        description: Required. Type of phase intensity.
      lowerZone:
        type: integer
        format: int64
        description: |-
          Lower zone bound for data tracking. Required for intensity types other than NONE.
          If tracked, goal of the phase is to stay at or above this zone limit, value from 1 to 5.
        maximum: 5
        minimum: 1
      upperZone:
        type: integer
        format: int64
        description: |-
          Upper zone bound for data tracking. Required for intensity types other than NONE.
          If tracked, goal of the phase is to stay at or below this zone limit, value from 1 to 5.
        maximum: 5
        minimum: 1
    title: Type of metric that will be tracked during the phase
  trainingtargetPhaseOrRepeat:
    type: object
    properties:
      name:
        type: string
        description: |-
          Phases will have these fields
          Required. Name of phase.
        maxLength: 45
        minLength: 1
      changeType:
        $ref: '#/definitions/PhaseOrRepeatChangeType'
        description: |-
          Required. Phase change type.
          Type of behaviour wrist unit should follow during phase change.
      goal:
        $ref: '#/definitions/trainingtargetPhaseGoal'
        description: Required. Phase goal. Determines when the phase will be complete.
      intensity:
        $ref: '#/definitions/trainingtargetPhaseIntensity'
        title: Required. Intensity type of the phase. Tells what metrics are tracked during the phase
      repeatCount:
        type: integer
        format: int64
        description: |-
          Repeats will have these fields
          How many times the child phases will be repeated, valid between 2 and 99 for repeats, unset for phases.
        maximum: 99
        minimum: 2
      phaseOrRepeat:
        type: array
        items:
          type: object
          $ref: '#/definitions/trainingtargetPhaseOrRepeat'
        description: Required for repeats. Child phases.
    title: |-
      Phase or repeat that is part of a exercise target.
      Phases do not have repeats
      Repeats can have phases, or more repeats
    required:
      - name
      - goal
  trainingtargetTrainingSessionTarget:
    type: object
    properties:
      id:
        type: string
        format: uint64
        description: Database ID. Required for update requests. Will be filled in responses.
      created:
        $ref: '#/definitions/trainingtargetDateTime'
        description: Database time of creation. Optional for requests. Will be filled in responses.
      modified:
        $ref: '#/definitions/trainingtargetDateTime'
        description: Database time of last modification. Optional for requests. Will be filled in responses.
      name:
        type: string
        description: Required. Name of the target. Max length is 45 characters.
        maxLength: 45
        minLength: 1
      sportId:
        type: string
        format: uint64
        description: |-
          Sport of the target.
          All available sports can be loaded from the /v4/data/sports/list endpoint.
      description:
        type: string
        description: Optional. Description of the target. Max length is 500 characters.
        maxLength: 500
      startTime:
        $ref: '#/definitions/trainingtargetDateTime'
        description: Required. Target start time.
      done:
        type: boolean
        description: |-
          Optional. Tells if the target is done or not.
          If true, it's expected that a training session exists that was executed based on the target and the session has the
          id of the target as a link.
      favoriteId:
        type: string
        format: uint64
        description: Database id of the favorite this target was based on. Required if target is based on a favorite.
      programId:
        type: string
        format: uint64
        description: Database id of program this target is part of. Required if target is part of an ETP program.
      eventId:
        type: string
        format: uint64
        description: |-
          Database id of an event training program event this target is for. Required for event targets.
          For example is user has ETP with goal of running a marathon, this is the event for the marathon.
      onDemandTypeId:
        type: integer
        format: int64
        description: On-demand type id. Not a DB id. Required for FitSpark targets.
      programUuid:
        type: string
        description: UUID of training program this target is part of. Required if target is part of a (non-ETP) training program.
      programTargetUuid:
        type: string
        description: UUID of specific training program target this target is based on. Required if target is part of a (non-ETP) training program.
      programSourceType:
        type: string
        description: |-
          Type of program this target belongs to. Required if target belongs to any program.
          ETP (Event Training Program) or ATP (Adaptive Training Program) for example.
      guidance:
        type: array
        items:
          type: object
          $ref: '#/definitions/trainingtargetTrainingSessionTargetGuidances'
        description: |-
          Optional. Guidances related to training target.
          How to do movements, possibly links to relevant videos etc.
      version:
        type: integer
        format: int64
        description: |-
          The version of target. Used for optimistic locking. Required for update requests. The set value is ignored and
          overwritten when saving a new target. Will be filled in responses.
      nonUserEditable:
        type: boolean
        description: Whether the target is not editable by the user. An unset value is interpreted as false.
    description: Target representing a full training session.
    required:
      - name
      - startTime
  trainingtargetTrainingSessionTargetGuidances:
    type: object
    properties:
      dataSerializationType:
        type: integer
        format: int64
        description: Required. Type of serialization. Required so that clients know how to deserialize the data.
      data:
        type: string
        description: Required. Serialized data containing the guidance.
        minLength: 1
    title: Guidance related to training target
    required:
      - dataSerializationType
      - data
  trainingtargetTrainingTarget:
    type: object
    properties:
      session:
        $ref: '#/definitions/trainingtargetTrainingSessionTarget'
        description: Target representing a full training session. Required in requests, and will be filled in responses.
      exercise:
        type: array
        items:
          type: object
          $ref: '#/definitions/trainingtargetExerciseTarget'
          required:
            - exercise
        description: |-
          Target representing a single exercise. Required in requests, and will be filled in responses.
          In theory one session can have multiple exercise targets, but in practice only one exercise target is expected.
        minItems: 1
    description: |-
      *
      Training target.
      A target in user's calendar that will be used by wrist unit to suggest and guide exercises.
      See "ExerciseType" for all possible target types.
    required:
      - session
