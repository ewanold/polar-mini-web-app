  domainsppiDeviceReference:
    type: object
    properties:
      uuid:
        type: string
        example: 0e030000-0084-0000-0000-00001234abcd
        description: Unique identifier of the device.
        maxLength: 36
        minLength: 36
    title: DeviceReference
    required:
      - uuid
  domainsppiErrorResponse:
    type: object
    properties:
      errorMessage:
        type: string
    title: ErrorResponse
  ppiDailyPpiSamples:
    type: object
    properties:
      date:
        type: string
        example: "2025-08-01"
        description: Date of the PPI samples in ISO 8601 format.
      modified:
        type: string
        format: date-time
        example: "2025-08-01T12:00:00Z"
        description: Timestamp in ISO 8601 format. UTC time. Returned if data has been found for the date.
      ppiSamplesPerDevice:
        type: array
        items:
          type: object
          $ref: '#/definitions/ppiRecordedPpiSamples'
          required:
            - ppi_samples_per_device
    title: DailyPpiSamples
    required:
      - date
  ppiListPpiSamplesResponse:
    type: object
    properties:
      dailyPpiSamples:
        type: array
        items:
          type: object
          $ref: '#/definitions/ppiDailyPpiSamples'
        description: Pulse to pulse interval samples per day.
    title: ListPpiSamplesResponse
  ppiPpiSample:
    type: object
    properties:
      offsetMillis:
        type: integer
        format: int64
        example: 70
        description: Offset of the sample from the beginning of the day in milliseconds.
      ppInterval:
        type: integer
        format: int64
        example: 1052
        description: Pulse to pulse interval value in milliseconds.
      errorEstimateMillis:
        type: integer
        format: int64
        example: 10
        description: Error estimate for the PPI value in milliseconds. Describes the quality of PPI sample.
      skinContact:
        type: boolean
        example: true
        description: Skin contact status. True if skin contact is detected, false otherwise.
      movement:
        type: boolean
        example: false
        description: Movement status. True if movement is detected, false otherwise.
      offline:
        type: boolean
        example: false
        description: Offline status. True if the PPI sample is recorded during an offline period, false otherwise.
    title: PpiSample
    required:
      - offsetMillis
      - ppInterval
      - errorEstimateMillis
      - skinContact
      - movement
      - offline
  ppiRecordedPpiSamples:
    type: object
    properties:
      recordingDevice:
        $ref: '#/definitions/domainsppiDeviceReference'
        description: Reference to the device that recorded the PPI samples.
      ppiSamples:
        type: array
        items:
          type: object
          $ref: '#/definitions/ppiPpiSample'
          required:
            - ppi_samples
        description: Recorded PPI samples.
      recordingTriggerTypeChanges:
        type: array
        items:
          type: object
          $ref: '#/definitions/ppiRecordingTriggerTypeChange'
          required:
            - recording_trigger_type_changes
        description: Recording trigger type changes for the recorded PPI samples.
    title: RecordedPpiSamples
    required:
      - recordingDevice
  ppiRecordingTriggerTypeChange:
    type: object
    properties:
      triggerType:
        $ref: '#/definitions/ppiRecordingTriggerTypeChangeTriggerType'
        example: TRIGGER_TYPE_AUTOMATIC
        description: Type of the recording trigger.
      offsetMillis:
        type: integer
        format: int64
        example: 70
        description: Offset of the recording trigger type change in milliseconds from the beginning of the day.
    title: RecordingTriggerTypeChange
    required:
      - triggerType
      - offsetMillis
  ppiRecordingTriggerTypeChangeTriggerType:
    type: string
    enum:
      - TRIGGER_TYPE_UNDEFINED
      - TRIGGER_TYPE_AUTOMATIC
      - TRIGGER_TYPE_MANUAL
    default: TRIGGER_TYPE_UNDEFINED
    description: |-
      - TRIGGER_TYPE_UNDEFINED: Undefined.
       - TRIGGER_TYPE_AUTOMATIC: Automatic recording (for example 24/7 recording).
       - TRIGGER_TYPE_MANUAL: Manual recording (started by user).
    title: TriggerType
