swagger: "2.0"
info:
  title: Polar AccessLink Dynamic API
  version: v4
  description: Polar AccessLink Dynamic API documentation
  contact:
    name: Support
    url: 'https://www.polar.com/accesslink'
    email: b2bhelpdesk@polar.com
  license:
    name: Polar Electro AccessLink Limited License Agreement
    url: 'https://www.polar.com/en/legal/polar-api-agreement'
tags:
  - name: Subscription
    description: Endpoints for user subscriptions related data.
  - name: Training targets
    description: Endpoints for training targets data. Training targets are structured workout plans or goals that users can create and follow to guide their exercise sessions. A training target can specify parameters such as exercise type, duration, distance, intensity, heart rate zones, or phases (e.g., warm-up, intervals, cool-down).
  - name: Favorites
    description: Endpoints for favorites data. Favorites are pre-defined training targets or routes that users have saved in their Polar Flow account for easy access and repeated use. Favorites can include specific workouts, training sessions, or routes with set parameters such as duration, distance, intensity, or heart rate targets.
  - name: Training Sessions
    description: Endpoints for managing training sessions.
  - name: User account
    description: Endpoints for managing user account data.
  - name: Daily activity
    description: Endpoints for managing daily activity data.
  - name: Calendar
    description: Endpoints for managing calendar entries.
  - name: Tests
    description: Endpoints for managing user tests.
  - name: Profile Pictures
    description: Endpoints for managing user profile pictures.
  - name: Sports and Sport Profiles
    description: Endpoints for Polar sports and user sport profiles. Sports are a Polar-managed catalogue (you can’t create new sports) that define defaults like speed/pace view, GPS, and supported features. Sport profiles are the user’s configurable per‑sport settings and training views managed in Polar Flow.
  - name: Sleep
    description: Endpoints for sleep data.
  - name: Routes
    description: Endpoints for route data. Routes are navigational paths the user saves in Polar Flow Favorites for use on supported devices; they can be imported (GPX/TCX), organized per device, and synced to the device for guidance during training.
  - name: User Devices
    description: Endpoints for managing user devices.
  - name: Pulse to pulse interval data
    description: Endpoints for loading pulse to pulse interval (PPI) data.
  - name: Nightly Recharge
    description: Endpoints for nightly recharge data.
  - name: Continuous samples
    description: Endpoints for managing continuous samples.
  - name: Skin Contact
    description: Endpoint for Skin Contact data.
  - name: Temperature Measurement
    description: 'Endpoint for Temperature Measurement data. These device recorded measurements may include, for example: skin temperatures.'
consumes:
  - application/json
produces:
  - application/json
paths:
  /subscriptions:
    get:
      summary: /subscriptions
      description: List all user subscriptions and their related entitlements.
      operationId: UserEntitlementService_ListSubscriptions
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/subscriptionListSubscriptionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainssubscriptionErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainssubscriptionErrorResponse'
        "500":
          description: Internal Error
          schema:
            $ref: '#/definitions/domainssubscriptionErrorResponse'
      tags:
        - Subscription
      security:
        - OAuth2:
            - user_subscription:read
  /training-target/calendar-targets:
    get:
      summary: Load user training targets for given date range
      operationId: TrainingTargetService_LoadTargets
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/trainingtargetLoadTargetsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domainstrainingtargetErrorResponse'
      parameters:
        - name: fromDate
          description: Required. Date in ISO 8601 format. Inclusive start date for the requested period.
          in: query
          required: false
          type: string
        - name: toDate
          description: Required. Date in ISO 8601 format. Exclusive end date for the requested period.
          in: query
          required: false
          type: string
      tags:
        - Training targets
      security:
        - OAuth2:
            - training_targets:read
  /training-target/favorites:
    get:
      summary: Load user favorites
      operationId: FavoritesService_LoadFavorites
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/trainingtargetLoadFavoritesResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domainstrainingtargetErrorResponse'
      tags:
        - Favorites
      security:
        - OAuth2:
            - training_targets:read
  /training-sessions/list:
    get:
      summary: List user training sessions
      description: Lists all Training Sessions of a user in a given date range. Parameters 'from' and 'to' control the range of the data. When no features are in use, date range can be 90 days. If features are used, only one day at a time can be requested.
      operationId: TrainingSessionService_List
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domainstrainingsessionListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainstrainingsessionErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainstrainingsessionErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domainstrainingsessionErrorResponse'
      parameters:
        - name: from
          description: Required. Date in ISO 8601 format. Inclusive start date for the requested period.
          in: query
          required: false
          type: string
        - name: to
          description: Required. Date in ISO 8601 format. Exclusive end date for the requested period.
          in: query
          required: false
          type: string
        - name: features
          description: |-
            Optional. List of features to include in the response.
            Available features:
             samples,
             test-results,
             training-load-report,
             laps,
             hill-splits,
             routes,
             statistics,
             zones,
             pause-times,
             strength-training-results,
             comments,
             physical-info
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - Training Sessions
      security:
        - OAuth2:
            - training_sessions:read
  /user/account-data:
    get:
      summary: Load user account data
      description: Returns all user's account data.
      operationId: AccountService_List
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domainsaccountLoadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainsaccountErrorResponse'
      tags:
        - User account
      security:
        - OAuth2:
            - profile:read
  /activity/list:
    get:
      summary: List user daily activity
      description: Lists all days where user has activity data stored.Parameters 'from' and 'to' control the range of the data. When no features are in use, date range can be 90 days. If features are used, only one day at a time can be requested.Without features the response contains only the dates where activity data is available.
      operationId: ActivityService_List
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domainsactivityListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainsactivityErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainsactivityErrorResponse'
        "500":
          description: Internal Error
          schema:
            $ref: '#/definitions/domainsactivityErrorResponse'
      parameters:
        - name: from
          description: |-
            Inclusive start date for the requested period.

            Required. Date in ISO 8601 format.
          in: query
          required: false
          type: string
        - name: to
          description: |-
            Exclusive end date for the requested period.

            Required. Date in ISO 8601 format.
          in: query
          required: false
          type: string
        - name: features
          description: |-
            Optional. List of features to include in the response.
            Available features: samples, activity-target, physical-information
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - Daily activity
      security:
        - OAuth2:
            - activity:read
  /calendar/list:
    get:
      summary: List calendar entries
      description: List user calendar entries within requested range. Parameters 'from' and 'to' control the range of the data. Maximum date range is 90 days. Use features to select which calendar entry types are to be returned .
      operationId: CalendarService_List
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domainscalendarLoadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainscalendarErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainscalendarErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domainscalendarErrorResponse'
      parameters:
        - name: from
          description: |-
            Inclusive start date for the requested period.
            Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: to
          description: |-
            Exclusive end date for the requested period.
            Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: features
          description: |-
            Optional. List of features to include in the response.
            Available features: notes, feeling, feedback, perceived-recovery, weight, physical-information
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - Calendar
      security:
        - OAuth2:
            - calendar:read
  /tests/list:
    get:
      summary: List user test results
      description: List user test results within requested range. Parameters 'from' and 'to' control the range of the data. When no features are in use, date range can be 90 days. If features are used, only one day at a time can be requested.
      operationId: TestsService_List
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domainstestsLoadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainstestsErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainstestsErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domainstestsErrorResponse'
      parameters:
        - name: from
          description: |-
            Inclusive start date for the requested period.
            Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: to
          description: |-
            Exclusive end date for the requested period.
            Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: features
          description: |-
            Optional. List of features to include in the response.
            Available features:
             samples
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - Tests
      security:
        - OAuth2:
            - tests:read
  /user/profile-picture:
    get:
      summary: Load profile picture
      description: Load profile picture of a user in a given size. The endpoint returns image data (e.g., JPEG, PNG) with the appropriate Content-Type header. Parameter 'size' is used to specify the size of the profile picture.
      operationId: ProfilePictureService_LoadProfilePicture
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/profilepictureHttpBody'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainsprofilepictureErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainsprofilepictureErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domainsprofilepictureErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domainsprofilepictureErrorResponse'
      parameters:
        - name: size
          description: Size of the profile picture.
          in: query
          required: true
          type: string
          enum:
            - small
            - medium
            - large
      tags:
        - Profile Pictures
      produces:
        - image/*
      security:
        - OAuth2:
            - profile:read
  /sports/list:
    get:
      summary: Retrieves all Sports available in the Polar ecosystem.
      description: Returns the Polar sports catalogue used when creating sport profiles. Use this as a reference for sport_id values in profiles.
      operationId: SportService_ListSports
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/sportListSportsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domainssportErrorResponse'
      tags:
        - Sports and Sport Profiles
      security:
        - OAuth2:
            - sports:read
  /sports/profile-list-catalog:
    get:
      summary: Load user's sport profile list catalog.
      description: 'Loads the user’s sport profile list catalogue including the active list index and the ordered profile UUIDs. This mirrors Flow’s Sport profiles ordering: active list items are transferred to devices on sync (up to device limits, typically 20). Use this to inspect or manage which profiles are active and their order before initiating a sync in Flow.'
      operationId: SportService_LoadProfileListCatalog
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/sportLoadProfileListCatalogResponse'
        "404":
          description: Profile list catalog does not exist
          schema:
            $ref: '#/definitions/domainssportErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domainssportErrorResponse'
      tags:
        - Sports and Sport Profiles
      security:
        - OAuth2:
            - sports:read
  /sports/profiles:
    get:
      summary: List user's Sport profiles.
      description: Lists the user’s sport profiles from Polar Flow. A sport profile contains per‑sport settings and training views (e.g., speed/pace view, GPS, zones, reminders, product‑specific displays).
      operationId: SportService_ListProfiles
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/sportListProfilesResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domainssportErrorResponse'
      tags:
        - Sports and Sport Profiles
      security:
        - OAuth2:
            - sports:read
  /sleep-wake-vectors:
    get:
      summary: /sleep-wake-vectors
      description: Lists user's sleep/wake state vectors in the given date range. Range maximum length is 7 days. Data is only available for the last 90 days.
      operationId: SleepService_ListSleepWakeVectors
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/sleepListSleepWakeVectorsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainssleepErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainssleepErrorResponse'
        "500":
          description: Internal Error
          schema:
            $ref: '#/definitions/domainssleepErrorResponse'
      parameters:
        - name: from
          description: Inclusive start date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: to
          description: Exclusive end date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
      tags:
        - Sleep
      security:
        - OAuth2:
            - sleep:read
  /sleeps:
    get:
      summary: /sleeps
      description: Lists user's sleep data in a given date range. Parameters 'from' and 'to' control the range of the data. When no features are in use, maximum date range is 30 days. If features are used, only one day at a time can be requested. Without features the response contains only the dates where sleep data is available.
      operationId: SleepService_ListSleeps
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/sleepListSleepsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainssleepErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainssleepErrorResponse'
        "500":
          description: Internal Error
          schema:
            $ref: '#/definitions/domainssleepErrorResponse'
      parameters:
        - name: from
          description: Inclusive start date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: to
          description: Exclusive end date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: features
          description: |-
            List of features to include in the response.
            Available features:
             sleep-result,
             original-sleep-result,
             sleep-evaluation,
             sleep-score.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - Sleep
      security:
        - OAuth2:
            - sleep:read
  /routes/{routeId}:
    get:
      description: Loads route data using route id. Note that loading 3rd party routes (e.g. Komoot, Strava, ...) is not supported.
      operationId: RouteService_LoadRoute
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/apiLoadRouteResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/routeapiErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/routeapiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/routeapiErrorResponse'
      parameters:
        - name: routeId
          description: |-
            Route id - Mandatory.

            Route id can be acquired by first fetching a list of Favorite or Calendar targets:
            - Calendar Training Targets (GET: /training-target/calendar-targets).
            - Favorites (GET: /training-target/favorites).

            and then extracting the wanted Route id from the response data.
          in: path
          required: true
          type: string
          format: uint64
      tags:
        - Routes
      security:
        - OAuth2:
            - routes:read
  /user-devices:
    get:
      summary: List user devices
      description: Load all user device data.
      operationId: UserDeviceService_ListUserDevices
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/userdeviceListUserDevicesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainsuserdeviceErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainsuserdeviceErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/domainsuserdeviceErrorResponse'
      tags:
        - User Devices
      security:
        - OAuth2:
            - devices:read
  /ppi-samples:
    get:
      summary: /ppi-samples
      description: Lists user's pulse-to-pulse interval samples in given range. Parameters 'from' and 'to' control the range of the data. When no features are in use, date range can be 90 days. If features are used, only one day at a time can be requested. Without features only dates and last modified timestamps are returned for days containing PPI data
      operationId: PpiDataService_ListPpiSamples
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/ppiListPpiSamplesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainsppiErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainsppiErrorResponse'
        "500":
          description: Internal Error
          schema:
            $ref: '#/definitions/domainsppiErrorResponse'
      parameters:
        - name: from
          description: Date in ISO 8601 format. Inclusive start date for the requested period.
          in: query
          required: true
          type: string
        - name: to
          description: Date in ISO 8601 format. Exclusive end date for the requested period.
          in: query
          required: true
          type: string
        - name: features
          description: |-
            Optional. List of features to include in the response.
            Available features: samples.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - Pulse to pulse interval data
      security:
        - OAuth2:
            - ppi_data:read
  /nightly-recharge-results:
    get:
      summary: ' /nightly-recharge-results'
      description: Lists all Nightly Recharge results of a user in a given date range.Parameters 'from' and 'to' control the range of the data. When no features are in use, date range can be 28 days. If features are used, only one day at a time can be requested.
      operationId: NightlyRecoveryService_List
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domainsnightlyrechargeListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainsnightlyrechargeErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainsnightlyrechargeErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domainsnightlyrechargeErrorResponse'
      parameters:
        - name: from
          description: Date in ISO 8601 format. Inclusive start date for the requested period.
          in: query
          required: true
          type: string
        - name: to
          description: Date in ISO 8601 format. Exclusive end date for the requested period.
          in: query
          required: true
          type: string
        - name: features
          description: |-
            List of features to include in the response.
            Available features:
            samples
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - Nightly Recharge
      security:
        - OAuth2:
            - nightly_recharge:read
  /continuous-samples:
    get:
      summary: Load continuous samples
      description: Loads samples for a user by date range. Parameters 'from' and 'to' control the range of the data. Maximum date range for heart rate samples is 30 days. Uses features to specify the sample types.
      operationId: ContinuousSamplesService_LoadContinuousSamples
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domainscontinuoussamplesLoadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domainscontinuoussamplesErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domainscontinuoussamplesErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domainscontinuoussamplesErrorResponse'
      parameters:
        - name: from
          description: Inclusive start date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: to
          description: Exclusive end date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: features
          description: |-
            List of features to include in the response.
            Available features: heart-rate-samples
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - Continuous samples
      security:
        - OAuth2:
            - continuous_samples:read
  /skin-contacts:
    get:
      summary: /skin-contacts
      description: Lists all Skin Contact data of a user in a given date range. Parameters 'from' and 'to' control the range of the data. Range is inclusive for 'from' and exclusive for 'to'. Range is limited to 90 days.
      operationId: SkinContactService_List
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/skincontactSkinContactListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: .com.polar.domains.skincontact.TemperatureMeasurementErrorResponse
        "403":
          description: Forbidden
          schema:
            $ref: .com.polar.domains.skincontact.ErrorResponse
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/skincontactSkinContactErrorResponse'
      parameters:
        - name: from
          description: Inclusive start date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: to
          description: Exclusive end date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
      tags:
        - Skin Contact
      security:
        - OAuth2:
            - skin_contact:read
  /temperature-measurements:
    get:
      summary: /temperature-measurements
      description: Lists all temperature measurements of a user in a given date range.Parameters 'from' and 'to' control the range of the data. Range is inclusive for 'from' and exclusive for 'to'. Range is limited to 90 days.
      operationId: TemperatureMeasurementService_List
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/temperaturemeasurementTemperatureMeasurementListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/temperaturemeasurementTemperatureMeasurementErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: .com.polar.domains.temperaturemeasurement.ErrorResponse
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/temperaturemeasurementTemperatureMeasurementErrorResponse'
      parameters:
        - name: from
          description: Inclusive start date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
        - name: to
          description: Exclusive end date for the requested period. Date in ISO 8601 format.
          in: query
          required: true
          type: string
      tags:
        - Temperature Measurement
      security:
        - OAuth2:
            - temperature_measurement:read
  /hello:
    get:
      tags:
        - Hello World
      summary: Returns a greeting message
      responses:
        '200':
          description: A successful response
          content:
            text/plain:
              schema:
                type: string
                example: Hello, world!
definitions:
  SubscriptionPlanStore:
    type: string
    enum:
