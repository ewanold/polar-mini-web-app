      - sampleInterval
  nightlyrechargeNightlyRechargeHrvSamples:
    type: object
    properties:
      startTime:
        type: string
        example: 2025-01-01T10:12:33.435
        description: Datetime in ISO 8601 format. In user local time zone.
      sampleInterval:
        type: string
        example: 300s
        description: Sampling interval in seconds.
      hrvValues:
        type: array
        items:
          type: number
          format: double
        title: List of values in ms
    title: NightlyRechargeHrvSamples
    required:
      - startTime
      - sampleInterval
  nightlyrechargeNightlyRechargeResult:
    type: object
    properties:
      created:
        type: string
        format: date-time
        example: "2025-01-01T10:12:33.435Z"
        description: Time when the result was created in ISO 8601 format. UTC time.
      modified:
        type: string
        format: date-time
        example: "2025-01-01T10:12:33.435Z"
        description: Time when the result was last modified in ISO 8601 format. UTC time.
      ansStatus:
        type: number
        format: double
        title: |-
          The limit of ansStatus is from -15.7068 to 15.7068. A value over 0 is representing
          higher parasympathetic activity than usually (and lower sympathetic) and value below 0
          is representing lower parasympathetic activity than usually (and higher sympathetic)
        maximum: 15.7068
        minimum: -15.7068
      recoveryIndicator:
        type: integer
        format: int64
        description: The combination of normalized ANS status and normalized Sleep Score and Sleep Metric. Between 1 to 6.
        maximum: 6
        minimum: 1
      recoveryIndicatorSubLevel:
        type: integer
        format: int64
        description: |-
          This is a number between 0-100 and it indicates in more detail what is the level of combination of ANS
          and Sleep inside the recoveryIndicator class. I.e. if your recovery_indicator is 2, then
          recovery_indicator_sub_level 0 indicates that you are at the bottom of that class and ~100
          indicates that you are at almost recovery_indicator level 3.
        maximum: 100
      ansRate:
        type: integer
        format: int64
        title: Rating of ans status in scale 1-5 compared to own usual level. (5 = best, 1 = worst)
        maximum: 5
        minimum: 1
      meanNightlyRecoveryRri:
        type: integer
        format: int64
        example: 800
        title: Mean of the HR (after 0.5h from sleep start to 4,5h after sleep start hr) samples to beat interval time. (ms)
      meanNightlyRecoveryRmssd:
        type: integer
        format: int64
        example: 800
        title: Mean of the PPI (after 0.5h from sleep start to 4,5h after sleep start PPI) calculated RMSSD values. (ms)
      meanNightlyRecoveryRespirationInterval:
        type: integer
        format: int64
        example: 800
        title: Mean of the respiration interval (after 0.5h from sleep start to 4,5h after sleep start) samples. (ms)
      meanBaselineRri:
        type: integer
        format: int64
        example: 800
        title: The mean RRI from the baseline calculation. (ms)
      sdBaselineRri:
        type: integer
        format: int64
        example: 800
        description: The standard deviation of RRI from baseline calculation.
      meanBaselineRmssd:
        type: integer
        format: int64
        example: 800
        description: The mean RMSSD from the baseline calculation.
      sdBaselineRmssd:
        type: integer
        format: int64
        example: 800
        description: The standard deviation of RMSSD from baseline calculation.
      meanBaselineRespirationInterval:
        type: integer
        format: int64
        example: 800
        title: mean Respiration Interval from the baseline calculation. (ms)
      sdBaselineRespirationInterval:
        type: integer
        format: int64
        example: 800
        description: The standard deviation of Respiration Interval from baseline calculation.
      sleepTip:
        type: string
        example: Consider reserving more time for sleep in your schedule. Keep your diet healthy, and take a moment for yourself for relaxing. This might improve the regenerative qualities of your sleep.
        description: Chosen sleep tip for the user.
      vitalityTip:
        type: string
        example: Take a nap, if you like. A power nap of no more than 20-30 minutes might do the trick. The best remedy for low energy levels today is reserving some time for rest.
        description: Chosen vitality tip for the user.
      exerciseTip:
        type: string
        example: You can train today, even if you might feel you're not 100% up for it.
        description: Chosen exercise tip for the user.
      sleepResultDate:
        type: string
        example: "2025-01-01"
        description: |-
          Date for which the sleep result and nightly recovery result is for
          Date in ISO 8601 format. In user local time zone.
      hrvSamples:
        type: array
        items:
          type: object
          $ref: '#/definitions/nightlyrechargeNightlyRechargeHrvSamples'
        title: Heart rate variability samples
      breathingRateSamples:
        type: array
        items:
          type: object
          $ref: '#/definitions/nightlyrechargeNightlyRechargeBreathingRateSamples'
        title: Breathing rate samples
    title: NightlyRechargeResult
    required:
      - created
      - modified
      - sleepResultDate
  nightlyrechargeNightlyRechargeResults:
    type: object
    properties:
      nightlyRechargeResults:
        type: array
        items:
          type: object
          $ref: '#/definitions/nightlyrechargeNightlyRechargeResult'
    title: NightlyRechargeResults
