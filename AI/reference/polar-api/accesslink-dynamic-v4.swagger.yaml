        $ref: '#/definitions/subscriptionUserSubscriptionStatus'
        title: User subscription status
      purchasedAt:
        type: string
        format: date-time
        example: 2025-01-01T10:12:33.435
        description: Time when the user subscription was purchased in ISO 8601 format.
      expiresAt:
        type: string
        format: date-time
