  subscriptionUserSubscriptionStatus:
    type: string
    enum:
      - STATUS_UNKNOWN
      - ACTIVE
      - CANCELLED
      - PAUSED
      - IN_GRACE_PERIOD
      - IN_BILLING_RETRY
      - EXPIRED
